name: review workspace
on:
  push:
    branches: ['improve/hardening-20260904']
    paths: ['.github/workflows/review-workspace.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: |
          printf 'package auth\nimport _ "golang.org/x/crypto/argon2"\n' > internal/auth/review_dependency.go
          go get golang.org/x/crypto@v0.33.0
          go mod tidy
          go mod vendor
          tar --exclude=.git -czf /tmp/gopieng-deps.tar.gz go.mod go.sum vendor
      - uses: actions/upload-artifact@v4
        with:
          name: gopieng-review-deps
          path: /tmp/gopieng-deps.tar.gz
          retention-days: 1
