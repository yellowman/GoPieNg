name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gopieng_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIENG_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/gopieng_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test with PostgreSQL and race detection
        run: go test -race -count=1 -timeout=3m ./...
      - name: Vet
        run: go vet ./...
      - name: JavaScript syntax and state regressions
        run: |
          for file in web/js/*.js; do node --check "$file"; done
          node --experimental-default-type=module --test web/js/*.test.mjs
      - name: Build Linux and OpenBSD
        run: |
          go build ./cmd/server
          GOOS=openbsd GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/gopieng-openbsd ./cmd/server
